name: rfg status
on:
  push:
  pull_request:
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: rfg help
        run: python3 rfg.py --help
      - name: rfg doctor
        run: python3 rfg.py doctor --format json
      - name: rfg status
        run: python3 rfg.py status --format json
        continue-on-error: true
      - name: recipes
        run: python3 rfg.py recipe list --format json

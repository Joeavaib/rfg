# Language capability flags. Unsupported is better than wrong.
# Honesty: index_semantic/rename are false everywhere. lsp.py is which-presence
# (doctrine T4), not live rust-analyzer/clangd. replace is identifier rewrite.
# SCIP is dump-import, not a live indexer. This file is not loaded at runtime.
languages:
  typescript:
    discover: true
    index_syntax: true
    index_semantic: false
    apply_replace: true
    rename: false
  go:
    discover: true
    index_syntax: true
    index_semantic: false
    apply_replace: true
    rename: false
  python:
    discover: true
    index_syntax: true
    index_semantic: false
    apply_replace: true
    rename: false
  rust:
    discover: true
    index_syntax: true
    index_semantic: false
    apply_replace: true      # no macros: macro files are exit 4 (see cli guard), use manual/implement
    apply_with_macros: false
    rename: false
    macros: unsupported
  cpp:
    discover: true
    index_syntax: true
    index_semantic: false
    apply_replace: false     # without compile-db: search only
    rename: false
    apply_without_compile_db: false
